[project]
name = "timetableking"
version = "0.1.0"
description = "TimetableKing – Stundenplanprogramm für Schulen (Backend)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Bitwise inversion:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # Zeilenlänge regelt ruff format
