<title>Stundenwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: App-Rahmen mit fixer Kopfleiste, Arbeitsfläche links (Raster), Seitenleiste rechts (Details, offene Stunden) */
:root {
  --bg: #eef2f5; --surface: #ffffff; --surface-2: #f6f8fa; --ink: #15212c; --muted: #5a6977; --line: #d6dee5; --line-strong: #b8c4cf;
  --accent: #1c5d92; --accent-soft: #dceaf6; --accent-ink: #ffffff;
  --good: #23784a; --good-soft: #d9f0e2; --warn: #9a5a00; --warn-soft: #fbecd2; --bad: #b42318; --bad-soft: #fbe0dd;
  --card-s: 62%; --card-l: 89%; --card-b: 52%; --card-ink: #15212c; --card-sub: #3d4b58;
  --shadow: 0 1px 2px rgba(21, 33, 44, .08), 0 4px 14px rgba(21, 33, 44, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1419; --surface: #161f27; --surface-2: #1b252e; --ink: #e3eaf0; --muted: #94a4b2; --line: #26323d; --line-strong: #364552;
    --accent: #6cb0ea; --accent-soft: #1b3448; --accent-ink: #08151f;
    --good: #5cc98b; --good-soft: #163626; --warn: #f0b354; --warn-soft: #3a2a10; --bad: #ff7b6e; --bad-soft: #3d1a17;
    --card-s: 32%; --card-l: 24%; --card-b: 48%; --card-ink: #eef3f7; --card-sub: #b9c6d1;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1419; --surface: #161f27; --surface-2: #1b252e; --ink: #e3eaf0; --muted: #94a4b2; --line: #26323d; --line-strong: #364552;
  --accent: #6cb0ea; --accent-soft: #1b3448; --accent-ink: #08151f;
  --good: #5cc98b; --good-soft: #163626; --warn: #f0b354; --warn-soft: #3a2a10; --bad: #ff7b6e; --bad-soft: #3d1a17;
  --card-s: 32%; --card-l: 24%; --card-b: 48%; --card-ink: #eef3f7; --card-sub: #b9c6d1;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: .86em; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }

/* Kopfleiste */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.brand-school { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-state { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
.save-state[data-s="saved"] .save-dot { background: var(--good); }
.save-state[data-s="saving"] .save-dot { background: var(--warn); }
.save-state[data-s="local"] .save-dot { background: var(--warn); }
.save-state[data-s="error"] .save-dot { background: var(--bad); }
.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 12px 11px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 2.5px solid transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .count { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; }

main { padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Bausteine */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.icon-btn { border: 0; background: none; padding: 4px; border-radius: 6px; cursor: pointer; color: var(--muted); display: inline-flex; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

input[type=text], input[type=number], input[type=time], select, textarea {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
label.field { display: grid; gap: 4px; font-weight: 600; font-size: 12.5px; color: var(--muted); }
label.field > input, label.field > select { color: var(--ink); font-weight: 400; font-size: 14px; }
.hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel-head h3 { font-size: 15px; }
.panel-body { padding: 12px 14px; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; }
.banner p { margin: 0; flex: 1 1 260px; }

/* Stundenplan-Ansicht */
.plan-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .plan-layout { grid-template-columns: minmax(0, 1fr); } }
.plan-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.plan-toolbar .grow { flex: 1; }
.entity-pick { display: flex; align-items: center; gap: 4px; }
.entity-pick select { min-width: 140px; font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.plan-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.plan-title h2 { font-size: 22px; }

.tt-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tt { --perw: 78px; display: grid; grid-template-rows: 36px repeat(var(--np), minmax(62px, auto)); min-width: calc(var(--perw) + var(--nd) * 132px); position: relative; }
.tt-day { grid-row: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--f-display); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--surface-2); }
.tt-corner { grid-row: 1; grid-column: 1; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tt-per { grid-column: 1; display: flex; flex-direction: column; justify-content: center; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.tt-per b { font-family: var(--f-display); font-size: 15px; }
.tt-per span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); line-height: 1.3; }
.tt-cell { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
.tt-cell.blocked { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-2) 6px 12px); }
.tt-cell.target-ok { background: var(--good-soft); cursor: pointer; }
.tt-cell.target-soft { background: var(--warn-soft); cursor: pointer; }
.tt-cell.target-swap { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); cursor: pointer; }
.tt-cell.target-no { background: var(--bad-soft); }
.tt-cell.hover { outline: 2px solid var(--accent); outline-offset: -2px; }

.card { margin: 3px; border-radius: 6px; padding: 5px 7px; min-width: 0; overflow: hidden; position: relative; z-index: 1; cursor: grab; user-select: none;
  background: hsl(var(--h) var(--card-s) var(--card-l)); border: 1px solid hsl(var(--h) 40% var(--card-b)); color: var(--card-ink);
  display: flex; flex-direction: column; gap: 1px; line-height: 1.25; }
.card:hover { box-shadow: var(--shadow); }
.card .c-sub { font-family: var(--f-display); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 4px; }
.card .c-line { font-size: 11.5px; color: var(--card-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .c-pin { width: 12px; height: 12px; margin-left: auto; color: var(--card-sub); flex: none; }
.card.selected { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.card.conflict { border: 2px solid var(--bad); }
.card.conflict::after { content: "!"; position: absolute; top: 3px; right: 6px; font-weight: 800; color: var(--bad); }
.tt.dragging .card { pointer-events: none; opacity: .45; }
.tt.picking .card:not(.selected) { opacity: .55; }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; width: 120px; opacity: .92; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); transform: rotate(-2deg); }
.drag-tip { position: fixed; z-index: 101; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 6px; max-width: 260px; }

/* Übersicht */
.ov-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.ov { border-collapse: collapse; font-size: 11.5px; }
.ov th, .ov td { border: 1px solid var(--line); padding: 0; text-align: center; }
.ov thead th { background: var(--surface-2); font-weight: 700; padding: 4px 2px; }
.ov th.row { position: sticky; left: 0; background: var(--surface); padding: 4px 10px; text-align: left; white-space: nowrap; z-index: 1; font-family: var(--f-display); }
.ov th.row button { border: 0; background: none; font: inherit; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.ov td { min-width: 34px; height: 30px; }
.ov td div { height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 700; background: hsl(var(--h) var(--card-s) var(--card-l)); color: var(--card-ink); }
.ov .day-start { border-left: 2px solid var(--line-strong); }

/* Seitenleiste */
.side { display: grid; gap: 14px; }
.tray { display: flex; flex-wrap: wrap; gap: 6px; }
.tray .card { margin: 0; width: calc(50% - 3px); min-height: 48px; }
.tray-empty { color: var(--muted); font-size: 13px; }
.tray-drop { border: 2px dashed var(--line-strong); border-radius: var(--r); padding: 10px; text-align: center; color: var(--muted); font-size: 12.5px; display: none; }
.dragging-on .tray-drop { display: block; }
.dragging-on .tray-drop.hover { border-color: var(--accent); color: var(--accent); }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 12px; }
.detail dt { color: var(--muted); font-size: 12.5px; }
.detail dd { margin: 0; font-weight: 600; min-width: 0; }
.detail .row-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.swatch { width: 28px; height: 28px; border-radius: 6px; background: hsl(var(--h) var(--card-s) var(--card-l)); border: 1px solid hsl(var(--h) 40% var(--card-b)); flex: none; }
.legend { display: grid; gap: 4px; font-size: 12.5px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

/* Generator */
.gen-progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.gen-progress div { height: 100%; background: var(--accent); width: 0; transition: width .2s linear; }
.workers { display: grid; gap: 4px; margin-top: 10px; font-size: 12.5px; }
.workers div { display: flex; justify-content: space-between; gap: 8px; }

/* Tabellen */
.list-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.list-head h2 { font-size: 22px; margin-right: auto; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr:hover td { background: var(--surface-2); }
.tbl td.actions { text-align: right; white-space: nowrap; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; margin: 1px 2px 1px 0; }
.subj-tag { background: hsl(var(--h) var(--card-s) var(--card-l)); border-color: hsl(var(--h) 40% var(--card-b)); color: var(--card-ink); }
.bar { width: 90px; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.over i { background: var(--bad); }
.class-sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.class-sum button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 120px; }
.class-sum button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.class-sum b { font-family: var(--f-display); font-size: 16px; }
.class-sum span { font-size: 12px; color: var(--muted); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }

/* Dialoge */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
dialog::backdrop { background: rgba(10, 18, 26, .45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg-head { padding: 16px 18px 10px; display: flex; align-items: center; gap: 10px; }
.dlg-head h3 { font-size: 18px; margin-right: auto; }
.dlg-body { padding: 4px 18px 16px; overflow-y: auto; display: grid; gap: 14px; }
.dlg-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg-foot .left { margin-right: auto; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick label { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink); }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.hues { display: flex; flex-wrap: wrap; gap: 6px; }
.hues button { width: 28px; height: 28px; border-radius: 6px; cursor: pointer; background: hsl(var(--h) var(--card-s) var(--card-l)); border: 1px solid hsl(var(--h) 40% var(--card-b)); }
.hues button[aria-pressed="true"] { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* Verfügbarkeit */
.av { display: grid; grid-template-columns: 40px repeat(var(--nd), minmax(34px, 1fr)); gap: 3px; user-select: none; touch-action: none; }
.av div { text-align: center; font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 2px 0; }
.av button { height: 28px; border-radius: 5px; border: 1px solid var(--line); background: var(--good-soft); cursor: pointer; padding: 0; }
.av button.off { background: repeating-linear-gradient(135deg, var(--bad-soft) 0 5px, var(--surface) 5px 9px); border-color: var(--bad); }

/* Einstellungen */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.periods-tbl input { width: 100%; }
.weight { display: grid; grid-template-columns: 1fr 60px; gap: 2px 12px; align-items: center; }
.weight input[type=range] { width: 100%; accent-color: var(--accent); }
.weight output { text-align: right; font-family: var(--f-mono); font-size: 12.5px; }
.weight .hint { grid-column: 1 / -1; }
.stack { display: grid; gap: 14px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-weight: 600; z-index: 200; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

@media (max-width: 600px) {
  .tt { --perw: 52px; min-width: calc(var(--perw) + var(--nd) * 104px); }
  .tt-per span { display: none; }
  .brand-school { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Erweiterungen v2 ---------- */
.card .c-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-badge { font-family: var(--f-body); font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 0 4px; border-radius: 4px; border: 1px solid currentColor; color: var(--card-sub); line-height: 14px; flex: none; }
.tt-cell.undesired { background: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--warn-soft) 80%, transparent) 7px 9px); }
.tt-per.brk, .tt-cell.brk { border-bottom: 2.5px solid var(--line-strong); }
.note { border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.note ul { margin: 0; padding-left: 18px; }
.note.bad { background: var(--bad-soft); color: var(--ink); }
.note.good { background: var(--good-soft); color: var(--good); display: flex; align-items: center; gap: 8px; font-weight: 600; }
.note svg { width: 16px; height: 16px; }
ul.hints { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
ul.hints li { padding: 6px 10px 6px 12px; border-radius: 6px; background: var(--surface-2); border-left: 3px solid var(--line-strong); }
ul.hints li.sev-bad { border-left-color: var(--bad); background: var(--bad-soft); }
ul.hints li.sev-warn, ul.hints li.sev-t, ul.hints li.sev-c, ul.hints li.sev-r { border-left-color: var(--warn); }

<script id="solver-src">
/* Stundenplan-Rechenkern v2. Läuft im Web Worker und im Hauptthread (Konfliktprüfung).
   problem = {
     nDays, nPeriods, noDouble:[bool je Stunde: keine Doppelstunde über die Pause danach],
     teachers:[{name, unav:[s], pref:[s], maxPerDay, maxHard, maxConsec, maxGapsDay, maxDays}],
     classes (= Schülergruppen-Atome):[{name, unav, pref, weekly, w, maxPerDay, maxHard, minPerDay}],
     rooms:[{name, unav}],
     cards:[{lesson, len, t:[fixe Lehrkräfte], tp:[Pool: eine davon], c:[Atome], rr:[[Raumoptionen] je Raumbedarf],
             maxPerDay, label, unav:[s], pen:[[s, Gewicht]]}],
     nLessons, rels:[{type:'diffDays'|'sameDay'|'notAdj', lessons:[li], w}],

      for (x = 0; x < cd.c.length; x++) if (occC[cd.c[x] * nS + s + j] === k) occC[cd.c[x] * nS + s + j] = -1;

    for (j = 0; j < cd.len; j++) {

      for (x = 0; x < cd.t.length; x++) if (unT[cd.t[x] * nS + s + j]) return true;

  function roomFree(k, r, s, taken) {
    if (taken && taken.indexOf(r) >= 0) return false;
    for (var j = 0; j < cards[k].len; j++) { if (unR[r * nS + s + j]) return false; var o = occR[r * nS + s + j]; if (o >= 0 && o !== k) return false; }
    return true;
  }
  // Räume für alle Raumbedarfe finden; null wenn nicht möglich
  function findRooms(k, s, prefer) {
    var rr = cards[k].rr, out = [];
    for (var q2 = 0; q2 < rr.length; q2++) {
      var opts = rr[q2], pr = prefer ? prefer[q2] : -1, pick = -1;
      if (pr >= 0 && opts.indexOf(pr) >= 0 && roomFree(k, pr, s, out)) pick = pr;
      else { var st = ri(opts.length); for (var i2 = 0; i2 < opts.length; i2++) { var r = opts[(st + i2) % opts.length]; if (roomFree(k, r, s, out)) { pick = r; break; } } }

  }
  function teacherSlotFree(t, s, k, len) {
    for (var j = 0; j < len; j++) { if (unT[t * nS + s + j]) return false; var o = occT[t * nS + s + j]; if (o >= 0 && o !== k) return false; }
    var tt = P.teachers[t];

    return true;
  }
  // Pool-Lehrkraft wählen: -1 kein Pool, -2 keine frei
  function findPool(k, s, prefer) {

      for (x = 0; x < cd.c.length; x++) { o = occC[cd.c[x] * nS + s + j]; if (o >= 0 && o !== k) return false; }
    }
    for (x = 0; x < cd.t.length; x++) { var tt = P.teachers[cd.t[x]]; if (tt.maxHard && tt.maxPerDay > 0 && cntT[cd.t[x] * nD + d] + cd.len > tt.maxPerDay) return false; }
    for (x = 0; x < cd.c.length; x++) { var cc = P.classes[cd.c[x]]; if (cc.maxHard && cc.maxPerDay > 0 && cntC[cd.c[x] * nD + d] + cd.len > cc.maxPerDay) return false; }

    if (tt.maxPerDay > 0 && cnt > tt.maxPerDay) cost += W.tMaxDay * (cnt - tt.maxPerDay);
    if (tt.maxConsec > 0 && maxRun > tt.maxConsec) cost += W.tConsec * (maxRun - tt.maxConsec);
    if (W.lunchT > 0 && W.lunchTo >= W.lunchFrom && last > W.lunchTo && first < W.lunchFrom) {
      var full = true; for (p = W.lunchFrom; p <= W.lunchTo; p++) if (occT[base + p] < 0) { full = false; break; }

/* Spuren für parallele Stunden (Gruppen) */
function laneLayout(items) {
  // items: [{d, p, len, id}] -> setzt lane und lanes

/* ================= Prüfung der Daten (vor dem Berechnen) ================= */
function diagnose() {
  var m = model(), out = [], nS = m.nD * m.nP, R = m.rules;
  function add(sev, text) { out.push({ sev: sev, text: text }); }
  // Klassen / Gruppen
  m.atoms.forEach(function (a) {
    var free = nS - a.unav.length;
    if (a.weekly > free) add('bad', a.name + ': ' + a.weekly + ' Wochenstunden, aber nur ' + free + ' mögliche Stunden');
    else if (a.maxHard && a.maxPerDay > 0 && a.weekly > a.maxPerDay * m.nD) add('bad', a.name + ': ' + a.weekly + ' Stunden passen nicht in ' + m.nD + ' Tage zu je höchstens ' + a.maxPerDay);
  });
  // Lehrkräfte
  var th = teacherHours();
  state.teachers.forEach(function (t, i) {
    var pt = m.problem.teachers[i], free = nS - pt.unav.length, need = th[i].fixed + th[i].team;
    if (need > free) add('bad', t.name + ': ' + need + ' Stunden, aber nur ' + free + ' verfügbare Stunden');
    if (pt.maxHard && pt.maxPerDay > 0) {
      var days = 0; for (var d = 0; d < m.nD; d++) { var any = false; for (var p = 0; p < m.nP; p++) if (pt.unav.indexOf(d * m.nP + p) < 0) any = true; if (any) days++; }
      if (need > pt.maxPerDay * days) add('bad', t.name + ': ' + need + ' Stunden passen nicht in ' + days + ' Tage zu je höchstens ' + pt.maxPerDay);
    }
    if (pt.maxDays > 0 && pt.maxPerDay > 0 && need > pt.maxDays * pt.maxPerDay) add('warn', t.name + ': ' + need + ' Stunden bei höchstens ' + pt.maxDays + ' Tagen zu ' + pt.maxPerDay + ' Stunden kaum möglich');
    if (t.target) { var diff = th[i].fixed + th[i].team + th[i].pool + th[i].poolOpen - t.target; if (diff < 0) add('info', t.name + ': ' + plural(-diff, 'Stunde', 'Stunden') + ' unter dem Soll (' + t.target + ')'); else if (th[i].fixed + th[i].team - t.target > 0) add('info', t.name + ': ' + plural(th[i].fixed + th[i].team - t.target, 'Stunde', 'Stunden') + ' über dem Soll (' + t.target + ')'); }
  });
  // Räume mit nur einer Option
  state.rooms.forEach(function (r, ri) {
    var need = 0; m.cards.forEach(function (c) { c.rr.forEach(function (o) { if (o.length === 1 && o[0] === ri) need += c.len; }); });
    var free = nS - m.problem.rooms[ri].unav.length;
    if (need > free) add('bad', r.name + ': wird ' + need + ' Stunden gebraucht, ist aber nur ' + free + ' Stunden verfügbar');
    else if (need > free * 0.9 && need > 0) add('warn', r.name + ': sehr stark ausgelastet (' + need + ' von ' + free + ' Stunden)');
  });
  // Unterricht
  state.lessons.forEach(function (l) {
    var parts = lessonParts(l), s = byId(state.subjects, l.subject), nm = (s ? s.short : '?') + ' ' + l.classes.map(function (r) { return refLabel(state, r); }).join(', ');
    if (!parts.some(function (p) { return p.teachers.length; }) && !l.pool.length) add('warn', nm + ': keine Lehrkraft eingetragen');
    if (!parts.some(function (p) { return p.classes.length; })) add('warn', nm + ': keine Klasse eingetragen');
    parts.forEach(function (p) { p.classes.forEach(function (r) { var a = r.split(':'), c = byId(state.classes, a[0]); if (!c || (a[1] && !groupName(c, a[1]))) add('bad', nm + ': Gruppe „' + r + '“ gibt es nicht mehr'); }); });
    var blocks = lessonCards(l).length, mx = l.maxPerDay > 0 ? l.maxPerDay : Math.ceil(blocks / m.nD);
    if (blocks > mx * m.nD) add('bad', nm + ': ' + blocks + ' Blöcke passen nicht in ' + m.nD + ' Tage bei höchstens ' + mx + ' pro Tag');
    if (l.coTeachers.length && l.teamHours > l.perWeek) add('warn', nm + ': mehr Teamteaching-Stunden als Wochenstunden');
  });
  // Karten ohne möglichen Platz
  try {
    var chk = createSolver(m.problem, 1); chk.load([], []);
    m.cards.forEach(function (c, k) {
      var any = false; for (var s2 = 0; s2 < nS && !any; s2++) { var r = chk.check(k, s2); if (!r.hard && r.rooms && r.tp !== -2) any = true; }
      if (!any) add('bad', c.label + (c.len === 2 ? ' (Doppelstunde)' : '') + ': passt zu keiner Zeit, weil Sperrzeiten von Lehrkraft, Klasse, Fach oder Raum alles blockieren');
    });
  } catch (e) { /* ignorieren */ }
  var order = { bad: 0, warn: 1, info: 2 };
  return out.sort(function (a, b) { return order[a.sev] - order[b.sev]; });
}

    st.periods.map(function (p, i) { return '<tr><td><input type="text" data-per="' + i + '" data-f="label" value="' + esc(p.label) + '" aria-label="Bezeichnung"></td><td><input type="time" data-per="' + i + '" data-f="start" value="' + esc(p.start) + '" aria-label="Beginn"></td><td><input type="time" data-per="' + i + '" data-f="end" value="' + esc(p.end) + '" aria-label="Ende"></td><td style="text-align:center"><input type="checkbox" data-per="' + i + '" data-f="noDouble"' + (p.noDouble ? ' checked' : '') + (i === st.periods.length - 1 ? ' disabled' : '') + ' aria-label="Große Pause nach dieser Stunde"></td></tr>'; }).join('') +
    '</tbody></table><p class="hint">„Große Pause danach“: Doppelstunden dürfen nicht über diese Pause gehen, z. B. über die Mittagspause.</p></div></section>';
  h += '<section class="panel"><div class="panel-head"><h3>Daten</h3></div><div class="panel-body stack">' +
    '<p class="hint" style="margin:0">' + (store.mode === 'cloud' ? 'Ihre Daten werden automatisch in Ihrem claude.ai-Konto gespeichert. Nur Sie sehen sie.' : 'Ihre Daten werden nur in diesem Browser gespeichert. Sichern Sie sie regelmäßig als Datei.') + '</p>' +
    '<div class="btn-row"><button class="btn" data-act="export-json">' + I.down + 'Sicherung herunterladen</button><button class="btn" data-act="import-json">' + I.up + 'Sicherung laden</button><input type="file" id="import-file" accept=".json,application/json" hidden></div>' +
    '<div class="btn-row"><button class="btn" data-act="export-print">' + I.down + 'Druckversion (HTML)</button><button class="btn" data-act="export-csv">' + I.down + 'Tabelle (CSV für Excel)</button></div>' +
    '<p class="hint" style="margin:0">Die Druckversion enthält alle Klassen-, Lehrkräfte- und Raumpläne. Öffnen Sie die Datei im Browser und drucken Sie sie dort oder speichern Sie sie als PDF.</p>' +
    '<div class="btn-row"><button class="btn danger" data-act="start-empty" data-confirm="Alles löschen und leer beginnen?">Leer beginnen</button><button class="btn" data-act="load-sample" data-confirm="Daten durch Beispiel ersetzen?">Beispielschule laden</button></div></div></section>';
  return h + '</div>';
}
function mountSettings() {
  var st = state.settings;
  var on = function (sel, ev, fn) { var el = $(sel); if (el) el.addEventListener(ev, fn); };
  on('#s-school', 'change', function (e) { st.school = e.target.value; changed(['settings']); });
  on('#s-year', 'change', function (e) { st.year = e.target.value; changed(['settings']); });
  on('#s-days', 'change', function (e) { st.days = +e.target.value; changed(['settings']); });
  $$('[data-per]').forEach(function (inp) {
    inp.addEventListener('change', function () { var p = st.periods[+inp.dataset.per]; p[inp.dataset.f] = inp.type === 'checkbox' ? inp.checked : inp.value; changed(['settings']); });
  });
  on('#import-file', 'change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var data = JSON.parse(rd.result);
        if (!data || !Array.isArray(data.lessons) || !data.settings) throw new Error('format');
        openDialog({ title: 'Sicherung laden', body: '<p>Die Datei „' + esc(f.name) + '“ enthält ' + plural((data.classes || []).length, 'Klasse', 'Klassen') + ', ' + plural((data.teachers || []).length, 'Lehrkraft', 'Lehrkräfte') + ' und ' + plural(data.lessons.length, 'Unterrichtseinheit', 'Unterrichtseinheiten') + '. Ihre aktuellen Daten werden dabei ersetzt.</p>',
          foot: '<button type="button" class="btn" data-act="dlg-close">Abbrechen</button><button type="submit" class="btn primary">Ersetzen und laden</button>',
          onSave: function () { state = normalize(data); undoStack = []; ui.selected = null; changed(SECTIONS.slice()); toast('Sicherung geladen'); } });
      } catch (err) { toast('Die Datei ist keine gültige Sicherung'); }
    };
    rd.readAsText(f);
  });
}

/* ================= Exporte ================= */
function exportJson() {
  var name = (state.settings.school || 'Stundenplan').replace(/[^\wäöüÄÖÜß\- ]+/g, '').trim().replace(/\s+/g, '-') || 'Stundenplan';
  offerFile(name + '-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(state, null, 1));
}
function exportCsv() {
  var m = model(), an = analysis(), rows = [];
  m.cards.forEach(function (card) {
    if (!an.placed[card.id]) return;
    var pl = state.placements[card.id], pi = poolIdx(card);
    for (var j = 0; j < card.len; j++) {
      var per = state.settings.periods[pl.p + j] || {};
      card.parts.forEach(function (part) {
        var ts = part.teachers.map(tShort); if (part.main) { if (pi >= 0) ts.push(tShort(pi)); card.co.forEach(function (c) { ts.push(tShort(c)); }); }
        var room = partRoom(card, part);
        (part.refs.length ? part.refs : ['']).forEach(function (ref) {
          rows.push([ref ? refLabel(state, ref) : '', DAY_NAMES[pl.d], pl.p + j + 1, per.start || '', per.end || '', part.subject.short, part.subject.name, ts.join(' '), room ? roomShort(room) : '', card.team && part.main ? 'Teamteaching' : '', card.parts.length > 1 ? 'Kopplung' : '']);
        });
      });
    }
  });
  rows.sort(function (a, b) { return String(a[0]).localeCompare(String(b[0])) || DAY_NAMES.indexOf(a[1]) - DAY_NAMES.indexOf(b[1]) || a[2] - b[2]; });
  rows.unshift(['Klasse/Gruppe', 'Tag', 'Stunde', 'Beginn', 'Ende', 'Fach', 'Fachname', 'Lehrkraft', 'Raum', 'Teamteaching', 'Kopplung']);
  var csv = '﻿' + rows.map(function (r) { return r.map(function (v) { v = String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\r\n');
  offerFile('Stundenplan.csv', csv);
}
function exportPrint() {
  var m = model(), an = analysis(), st = state.settings;
  function table(view, eid, keyPrefix, idx) {
    var h = '<table><thead><tr><th class="per"></th>';
    for (var d = 0; d < m.nD; d++) h += '<th>' + DAY_NAMES[d] + '</th>';
    h += '</tr></thead><tbody>';
    for (var p = 0; p < m.nP; p++) {
      h += '<tr' + (st.periods[p].noDouble ? ' class="brk"' : '') + '><th class="per">' + (p + 1) + '.<small>' + esc(st.periods[p].start || '') + '–' + esc(st.periods[p].end || '') + '</small></th>';
      for (d = 0; d < m.nD; d++) {
        var ids = an.occ[keyPrefix + idx + '_' + (d * m.nP + p)] || [];
        if (!ids.length) { h += '<td></td>'; continue; }
        h += '<td>' + ids.map(function (id) {
          var card = m.cards[m.cardIndex[id]], parts = relevantParts(card, view, eid);
          return '<div class="e" style="background:hsl(' + parts[0].subject.hue + ' 60% 92%)">' + parts.map(function (pt) {
            var ts = pt.teachers.map(tShort); if (pt.main) { var pi = poolIdx(card); if (pi >= 0) ts.push(tShort(pi)); card.co.forEach(function (c) { ts.push(tShort(c)); }); }
            var r = partRoom(card, pt);
            var sub = view === 'class' ? [pt.refs.some(function (x) { return x.indexOf(':') > 0; }) ? partGroups(pt) : '', ts.join(' '), r ? roomShort(r) : ''] : view === 'teacher' ? [partGroups(pt), r ? roomShort(r) : ''] : [partGroups(pt), ts.join(' ')];
            return '<b>' + esc(pt.subject.short) + '</b><span>' + esc(sub.filter(Boolean).join(' · ')) + '</span>';
          }).join('') + '</div>';
        }).join('') + '</td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }
  var head = function (t) { return '<header><h1>' + esc(t) + '</h1><p>' + esc(st.school) + ' · ' + esc(st.year || '') + '</p></header>'; };
  var pages = state.classes.map(function (c, i) { return '<section>' + head('Klasse ' + c.name) + table('class', c.id, 'c', i) + '</section>'; })
    .concat(state.teachers.map(function (t, i) { return '<section>' + head(t.name + ' (' + t.short + ')') + table('teacher', t.id, 't', i) + '</section>'; }))
    .concat(state.rooms.map(function (r, i) { return '<section>' + head(r.name) + table('room', r.id, 'r', i) + '</section>'; }));
  var doc = '<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Stundenpläne ' + esc(st.school) + '</title><style>' +
    '@page{size:A4 landscape;margin:10mm}body{font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#15212c;margin:0}section{page-break-after:always;padding:8px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #15212c;margin-bottom:10px}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#555}' +
    'table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #9aa7b3;padding:3px;vertical-align:middle;text-align:center;height:44px}thead th{background:#eef2f5;height:auto;padding:6px}th.per{width:66px;font-size:14px}th.per small{display:block;font-weight:400;font-size:10px;color:#555}tr.brk td,tr.brk th{border-bottom:3px solid #15212c}' +
    'td .e{display:flex;flex-direction:column;gap:1px;padding:3px;border-radius:4px;margin:1px}td b{font-size:14px}td span{font-size:10.5px;color:#333}' +
    '@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>' + pages.join('') + '</body></html>';
  offerFile('Stundenplaene.html', doc);
}

/* ================= Ereignisse ================= */
function arm(btn) {
  if (btn.classList.contains('armed')) return true;
  btn.classList.add('armed', 'danger');
  btn.dataset.old = btn.innerHTML; btn.textContent = btn.dataset.confirm;
  setTimeout(function () { if (btn.isConnected && btn.classList.contains('armed')) { btn.classList.remove('armed'); btn.innerHTML = btn.dataset.old; } }, 3500);
  return false;
}
document.addEventListener('click', function (e) {
  if (suppressClick) return;
  var tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { if ($('#dlg').open) closeDialog(); location.hash = tabBtn.dataset.tab; return; }
  var a = e.target.closest('[data-act]');
  var cardEl = e.target.closest('.card[data-card]');
  var cell = e.target.closest('.tt-cell');
  if (!a && cardEl && ui.tab === 'plan') {
    var cid = cardEl.dataset.card;
    if (ui.selected && ui.selected !== cid && cardEl.closest('#tt') && ui.targets) {
      var cur = state.placements[cid];
      if (cur) { var s0 = cur.d * model().nP + cur.p, t0 = ui.targets[s0]; if (t0 && t0.cls === 'swap' && t0.swap.other === cid) { applyTarget(ui.selected, s0, t0); return; } }
    }
    ui.selected = ui.selected === cid ? null : cid; render(); return;
  }
  if (!a && cell && ui.selected && ui.targets) {
    var s = +cell.dataset.s, t = ui.targets[s];
    if (t && applyTarget(ui.selected, s, t)) return;
    if (t && t.cls === 'no') toast((t.reasons || ['Nicht möglich']).join(' · '));
    return;
  }
  if (!a) return;
  if (a.closest('#dlg') && ['part-add', 'part-del', 'div-add', 'div-del', 'av-preset'].indexOf(a.dataset.act) >= 0) return;
  if (a.dataset.confirm && !arm(a)) return;
  var act = a.dataset.act;
  switch (act) {
    case 'view': ui.view = a.dataset.v; ui.selected = null; saveUi(); render(); break;
    case 'goto': ui.view = a.dataset.v; ui.entity[a.dataset.v] = a.dataset.id; ui.selected = null; saveUi(); render(); break;
    case 'ent-step': {
      var l = entityList(ui.view), i = l.findIndex(function (x) { return x.id === currentEntity(); });
      ui.entity[ui.view] = l[(i + (+a.dataset.dir) + l.length) % l.length].id; ui.selected = null; saveUi(); render(); break;
    }
    case 'deselect': ui.selected = null; render(); break;
    case 'lock': { var pl = state.placements[a.dataset.card]; if (pl) { pushUndo(pl.locked ? 'Fixierung gelöst' : 'Stunde fixiert'); pl.locked = !pl.locked; changed(['placements']); } break; }
    case 'unplace': unplaceCard(a.dataset.card); break;
    case 'undo': undo(); break;
    case 'toggle-hints': ui.showAllHints = !ui.showAllHints; render(); break;
    case 'gen-open': openGen(); break;
    case 'gen-start': startGen(); break;
    case 'gen-stop': finishGen(true); break;
    case 'goto-rules': closeDialog(); location.hash = 'bedingungen'; break;
    case 'dlg-close': closeDialog(); break;
    case 'copy-area': {
      var ta = $('#copy-area');
      try { navigator.clipboard.writeText(ta.value).then(function () { toast('Kopiert'); }, function () { ta.select(); toast('Text markiert, bitte mit Strg+C kopieren'); }); } catch (err) { ta.select(); }
      break;
    }
    case 'add': editEntity(a.dataset.kind, null); break;
    case 'edit': editEntity(a.dataset.kind, a.dataset.id); break;
    case 'del': deleteEntity(a.dataset.kind, a.dataset.id); break;
    case 'add-rel': editRelation(null); break;
    case 'edit-rel': editRelation(a.dataset.id); break;
    case 'lfilter': ui.lessonFilter = a.dataset.id || null; render(); break;
    case 'hide-banner': ui.bannerHidden = true; saveUi(); render(); break;
    case 'start-empty': state = emptyState(); undoStack = []; ui.selected = null; ui.bannerHidden = false; changed(SECTIONS.slice()); location.hash = 'faecher'; toast('Leere Schule angelegt'); break;
    case 'load-sample': state = sampleWithPlan(); undoStack = []; ui.selected = null; ui.bannerHidden = false; changed(SECTIONS.slice()); toast('Beispielschule geladen'); break;
    case 'per-add': { var ps = state.settings.periods, last = ps[ps.length - 1] || { end: '08:00' }; ps.push({ label: String(ps.length + 1), start: last.end, end: '', noDouble: false }); changed(['settings']); break; }
    case 'per-del': state.settings.periods.pop(); changed(['settings']); break;
    case 'w-reset': state.settings.weights = defaultWeights(); state.settings.rules = defaultRules(); changed(['settings']); toast('Standardwerte gesetzt'); break;
    case 'export-json': exportJson(); break;
    case 'import-json': $('#import-file').click(); break;
    case 'export-csv': exportCsv(); break;
    case 'export-print': exportPrint(); break;
    case 'sub-day': {
      var nd = addDays(subDate(), +a.dataset.dir), w = weekdayIdx(nd), dir = +a.dataset.dir;
      while (w >= model().nD) { nd = addDays(nd, dir); w = weekdayIdx(nd); }
      ui.subDate = nd; render(); break;
    }
    case 'sub-today': ui.subDate = null; render(); break;
    case 'sub-pick': state.subs[a.dataset.key] = { mode: 'sub', teacher: a.dataset.t }; changed(['subs']); break;
    case 'add-abs': if (!state.teachers.length) { toast('Bitte zuerst Lehrkräfte anlegen'); break; } editAbsence(null); break;
    case 'edit-abs': editAbsence(a.dataset.id); break;
    case 'export-subs': exportSubs(); break;
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'ent-sel') { ui.entity[ui.view] = t.value; ui.selected = null; saveUi(); render(); }
  if (t.classList.contains('room-sel')) {
    var pl = state.placements[t.dataset.card]; if (!pl) return;
    pushUndo('Raum geändert'); pl.rooms[+t.dataset.req] = t.value || null; changed(['placements']);
  }
  if (t.classList.contains('pool-sel')) {
    var pl2 = state.placements[t.dataset.card]; if (!pl2) return;
    pushUndo('Lehrkraft geändert'); pl2.pool = t.value || null; changed(['placements']);
  }
});
document.addEventListener('keydown', function (e) {
  var typing = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName || '');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing && !$('#dlg').open) { e.preventDefault(); undo(); }
  if (e.key === 'Escape' && ui.selected && !$('#dlg').open) { ui.selected = null; render(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card')) { e.preventDefault(); e.target.click(); }
});

/* ================= Navigation ================= */
function route() {
  var h = (location.hash || '').replace('#', '');
  ui.tab = TABS.some(function (t) { return t[0] === h; }) ? h : 'plan';
  if (ui.tab !== 'plan') ui.selected = null;
  render();
}
window.addEventListener('hashchange', route);
route();
setSave('loading');
initStore();
})();</script>
