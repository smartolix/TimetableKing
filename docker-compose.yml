services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: timetable
      POSTGRES_DB: timetableking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable -d timetableking"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      TTK_DATABASE_URL: postgresql+psycopg://timetable:timetable@db:5432/timetableking
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
